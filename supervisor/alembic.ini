# The alembic command line for developers (ADR-0444), from supervisor/ with a database file:
#   .venv/bin/alembic -x db=PATH upgrade head
#   .venv/bin/alembic -x db=PATH revision --autogenerate --rev-id NNNN -m "what changes"
# supervisor/AGENTS.md says how to add a migration. The supervisor itself reads no file: its
# configuration is migration_config() of src/database.py, the same scripts.
[alembic]
script_location = %(here)s/src/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s
