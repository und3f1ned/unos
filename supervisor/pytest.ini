[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Ignore non-test directories
norecursedirs = fixtures __pycache__ .git
# Suppress third-party deprecation warnings
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::RuntimeWarning:src.security.*
    # A few tests forge tokens with short published placeholders, or check a wrong key, on purpose.
    ignore::jwt.warnings.InsecureKeyLengthWarning
# A test that waits without a deadline held a whole make check at 99%: one that runs longer than this
# prints the stack of every thread and ends its process, and pytest-xdist names the test of that
# worker, starts another and fails the run (ADR-0492). Above the longest timeout that a test gives a
# command (tests/test_repo_tooling.py checks it), so that the test's own timeout ends a slow one first.
faulthandler_timeout = 900
faulthandler_exit_on_timeout = true
