<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>UNOS</title>
		<!-- The theme before the page is drawn (ADR-0405): a file, as the CSP allows no inline script but SvelteKit's own. -->
		<script src="/theme-init.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" data-sveltekit-preload-code="hover" class="bg-surface text-content">
		<!-- The boot screen (ADR-0430): drawn by app.css alone from the first frame, in the theme that
		     theme-init.js set, until the app knows the account and the page has drawn its skeleton
		     ($lib/boot.ts fades it out and removes it). No text and no role: screen readers and the
		     specs read the page under it. -->
		<div id="boot" class="boot" aria-hidden="true">
			<div class="boot-mark">
				<span class="boot-logo">
					<svg
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<rect width="20" height="8" x="2" y="2" rx="2" ry="2" />
						<rect width="20" height="8" x="2" y="14" rx="2" ry="2" />
						<line x1="6" x2="6.01" y1="6" y2="6" />
						<line x1="6" x2="6.01" y1="18" y2="18" />
					</svg>
				</span>
				<span class="boot-word"></span>
			</div>
			<div class="boot-progress"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
