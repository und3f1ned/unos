# Weekly update proposals (ADR-0218). Dependabot opens grouped pull requests with Conventional
# Commit prefixes (build, ci; with the scope deps or deps-dev, ADR-0209). Nothing is merged
# automatically: the supervisor runs privileged with the Docker socket, so every update is reviewed
# and merged by the owner. A cooldown skips releases younger than a week; compromised releases are
# usually pulled by then.
#
# Not here: .github/lint-requirements.txt (ruff, mypy, shellcheck and pip-audit with every dependency
# and hash, compiled by uv from lint-requirements.in; docs/TESTING.md has the command) and
# .github/audit-env-requirements.txt (the hashed tools of scripts/audit-python.sh, ADR-0423), moved
# by hand in the monthly maintenance pass; Playwright, that is
# @playwright/test and the image of webui/Dockerfile.test, which carries its version, moved together
# by hand in the monthly maintenance pass; and new major versions of npm packages, which change the
# web UI's toolchain and come as features of feature-list.json (ADR-0427).
version: 2
updates:
  - package-ecosystem: pip
    directory: /supervisor
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /webui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@playwright/test"
    groups:
      npm:
        patterns: ["*"]

  # The workflows pin every action to the commit of a release, with its version in a comment
  # (`actions/checkout@<sha> # v7.0.1`, ADR-0423): Dependabot proposes the newer release's
  # commit and rewrites the comment. No rule keeps an action back.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # The base images. Every FROM line names a tag and its digest (ADR-0305): Dependabot proposes
  # the tag's newer digest once the tag has not moved for the cooldown, and the monthly pass of
  # docs/maintenance.md moves the pins it leaves. Python and Node.js move only on purpose: the
  # Python version is also set in CI and the venvs, and Node.js's major version in CI and
  # webui/package.json (engines).
  - package-ecosystem: docker
    directories:
      - /supervisor
      - /webui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The Alpine release of the web UI's builder fixes its Node.js major version (ADR-0370).
      - dependency-name: alpine
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Dependabot names an image without its registry (mcr.microsoft.com/playwright).
      - dependency-name: playwright
    groups:
      docker:
        patterns: ["*"]
