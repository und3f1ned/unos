name: Audit

# Advisories are published without any change to this repository, so the runtime
# dependencies are audited every week (ADR-0218). The Lint and Frontend jobs of test.yml
# audit every push to main and every pull request (ADR-0462); this workflow catches what
# changes without a push. The commands are those of make audit. A finding
# fails the run: update the affected package (supervisor/requirements.txt, or
# webui/package-lock.json, e.g. with npm update <package>) rather than weakening the check.
# As in test.yml, every action is pinned to the commit of a release and pip installs wheels
# only, but nut2 (ADR-0423).
on:
  schedule:
    # Mondays, 06:17 UTC.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  python:
    name: Audit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            supervisor/requirements.txt
            .github/lint-requirements.txt

      - name: Install pip-audit
        run: 'pip install --require-hashes --only-binary=:all: -r .github/lint-requirements.txt'

      # In an environment of pinned, hashed tools (scripts/audit-python.sh, ADR-0423).
      - name: Audit the supervisor's runtime dependencies
        run: scripts/audit-python.sh

  node:
    name: Audit (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # npm audit reads webui/package-lock.json; it installs nothing.
      - name: Audit the web UI's runtime dependencies
        working-directory: webui
        run: npm audit --omit=dev --audit-level=high

  # The known vulnerabilities of UNOS's two images (ADR-0446): make image-scan builds the
  # supervisor's and the web UI's image as an install does, then trivy, pinned by digest, scans
  # each one without the network. A fixable HIGH or CRITICAL vulnerability fails the run, and the
  # table names its package and the fixed version: move the base image's digest or the package,
  # or add an entry with its reason and expiry to .trivyignore.yaml.
  images:
    name: Image vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and scan both images
        run: make image-scan

  # The platforms recorded for the catalog's images against the registries (ADR-0403). The same
  # command as make catalog-platforms. Every image is pinned (ADR-0410), so a difference means a
  # pin whose record was not rewritten or an index that is gone: run scripts/catalog-platforms.py
  # record and review the diff.
  platforms:
    name: Catalog image platforms
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: supervisor/requirements.txt

      - name: Install the supervisor's dependencies (the script reads the catalog)
        run: 'pip install --only-binary=:all: --no-binary=nut2 -r supervisor/requirements.txt'

      - name: Compare the recorded platforms with the registries
        run: python scripts/catalog-platforms.py check

  # The pinned tags of the catalog's images against the registries (ADR-0410). The same command as
  # make catalog-tags, with HEAD requests only. A moved tag means that its publisher pushed the
  # pinned version again, or that a line tag (Traefik's v3.7) moved on: review the new index, then
  # pin it in supervisor/src/apps/catalog.py with its VOLUMEs and size and record its platforms, or
  # keep the pin and say why. Immich's five pins move only together with an Immich release.
  tags:
    name: Catalog image tags
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: supervisor/requirements.txt

      - name: Install the supervisor's dependencies (the script reads the catalog)
        run: 'pip install --only-binary=:all: --no-binary=nut2 -r supervisor/requirements.txt'

      - name: Compare the pinned tags with the registries
        run: python scripts/catalog-platforms.py tags

  # make setup on a fresh runner, as the owner bootstraps a new checkout (ADR-0217):
  # the runner image, the Python and Node.js releases, the package indexes and Playwright's browser
  # download change without a change here, like advisories, and a change here can break the
  # bootstrap that only stub tools test otherwise. make setup ends with its baseline, make
  # check-fast and then make smoke; a missing prerequisite, a failed install or a red baseline
  # exits 1 and fails the run, whose last lines name the part. The checkout has the whole history,
  # as a clone does, for the tests that read it (the coverage floor's, the ledger's merge base with
  # origin/main); Python 3.11 and Node.js 22 are the prerequisites that setup.sh checks, without a
  # cache, so every package comes from its index.
  bootstrap:
    name: Bootstrap (make setup)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: make setup, then its baseline make check-fast and make smoke
        run: make setup
