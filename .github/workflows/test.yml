name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository. Their checkouts do not keep the token in
# the git configuration (persist-credentials: false): no step needs it later,
# and the build or test code of a dependency could read it there.
permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one. Every
# push to main gets a group of its own, so its run is never cancelled or held
# back by another one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Fast unit tests - runs on every push/PR
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supervisor

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            supervisor/requirements.txt
            supervisor/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short --ignore=tests/mocks --ignore=tests/fixtures

  # Static checks of the supervisor: pyflakes (undefined names, unused imports
  # and variables, ...) and syntax errors (E9), and the known vulnerabilities
  # of its runtime dependencies. ruff and pip-audit, and every package they
  # depend on, come from .github/lint-requirements.txt with their hashes, so
  # that a new release cannot change the tools. docs/TESTING.md has the same
  # commands for a local run.
  lint:
    name: Lint and Audit (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            supervisor/requirements.txt
            .github/lint-requirements.txt

      - name: Install ruff and pip-audit
        id: tools
        run: pip install --require-hashes -r .github/lint-requirements.txt

      # Each check runs even if the other one failed.
      - name: Ruff
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ruff check --select F,E9 supervisor

      # Resolves requirements.txt, with the dependencies of its packages, in a
      # temporary virtual environment. pip-audit first installs the latest pip,
      # setuptools and wheel there: they are not pinned.
      - name: Audit the runtime dependencies
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: pip-audit -r supervisor/requirements.txt

  # The web UI: production build, type check, and the known vulnerabilities of
  # its runtime dependencies. Node.js as in the builder stage of
  # webui/Dockerfile.
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      # Each check runs even if another one failed.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # The check script of package.json: svelte-kit sync, which writes
      # .svelte-kit/tsconfig.json (tsconfig.json extends it), then
      # svelte-check --threshold error. npm run takes both programs from
      # node_modules/.bin, where npm ci installed the versions of
      # package-lock.json. npx would download a missing one from the
      # registry instead, without asking where CI is set.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check

      - name: Audit the runtime dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

  # Build check - only on main branch to save costs
  build:
    name: Build Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          cd deploy
          docker compose build --quiet
