name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository (ADR-0190). Their checkouts do not keep the token in the git
# configuration (persist-credentials: false): no step needs it later, and the build or test code of
# a dependency could read it there. Every action is pinned to the commit of a release, with its
# version in a comment, which Dependabot moves together (ADR-0423): a tag can be moved to other
# code. pip installs wheels only, but nut2, which has none (--no-binary=nut2).
permissions:
  contents: read

# A new push to a pull request cancels the run for the previous one. Every
# push to main gets a group of its own, so its run is never cancelled or held
# back by another one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The Unit Tests, Lint and Frontend jobs run the targets of the Makefile that make check runs on a
# workstation (ADR-0216), so a local run and CI check the same things. docs/TESTING.md describes
# them; supervisor/tests/test_deploy_scripts.py and test_repo_tooling.py keep them in step.
#
# Which of them a run needs, the job Changed paths decides from the files that changed (ADR-0467):
# Unit Tests unless only documents and the ledger changed, Lint unless only those and webui/, Frontend
# unless nothing below webui/ nor the Makefile changed, Build Check on main unless nothing that the
# images build from changed, and Docs and Ledger for documents alone. A push to main that merges a pull
# request whose run tested the same parents and tree runs none of Unit Tests, Lint, Frontend and Docs
# and Ledger, and a push skips nothing when the run of main before it did not pass. A job runs unless
# the output that skips it says so, so a failed Changed paths runs them all. Commit Messages and
# Secret Scan run whatever changed. The jobs are skipped by their if, never by a path filter on the
# trigger: GitHub reports a skipped job as passed, and a workflow that never starts reports nothing.
jobs:
  # scripts/ci/changed_areas.py: on a push, first the one step with the job's token, which may read the
  # workflow's runs and their logs (actions: read) and nothing else; then the list of the changed files
  # and their areas, and on a pull request the record of the commits that this run tests.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.areas.outputs.docs_only }}
      lint: ${{ steps.areas.outputs.lint }}
      webui: ${{ steps.areas.outputs.webui }}
      images: ${{ steps.areas.outputs.images }}
      tested: ${{ steps.runs.outputs.tested }}

    steps:
      # The whole history: the merge base of a pull request, the before of a push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Look up the runs that checked main and this merge
        id: runs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/changed_areas.py runs

      - name: Find what this run checks
        id: areas
        env:
          BEFORE_PASSED: ${{ steps.runs.outputs.passed }}
        run: python3 scripts/ci/changed_areas.py areas

  # The backend tests: make test (pytest over supervisor/tests), with Samba's testparm (ADR-0463).
  test:
    name: Unit Tests
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The whole history with every branch: tests/test_feature_list.py compares the ledger with
      # the one at the merge base with origin/main and skips while main has no feature-list.json.
      # FEATURE_LIST_BASE stays unset until main has the ledger.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            supervisor/requirements.txt
            supervisor/requirements-dev.txt

      - name: Install dependencies
        id: deps
        run: 'pip install --only-binary=:all: --no-binary=nut2 -r supervisor/requirements-dev.txt'

      # Samba's testparm, from the runner's Ubuntu, for tests/test_smbconf_testparm.py, which fails
      # rather than skips without it where GitHub sets CI=true (ADR-0463). /run/samba is the cache
      # directory of the rendered [global] (ADR-0277) and the lock and pid directory of Ubuntu's
      # Samba: testparm fails without it, and the runner's user cannot make it. The version goes
      # into the log. A failed install fails the job, and the tests still run.
      - name: Install Samba's testparm
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends samba-common-bin
          sudo mkdir -p -m 0755 /run/samba
          testparm --version

      # -rfEs: the summary lists every failure and error, as pytest's default -rfE does, and every
      # skip with its place and reason.
      - name: Run tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          PYTEST_ARGS: -rfEs
        run: make test

  # make lint: ruff with the rules of ruff.toml (pyflakes findings, syntax
  # errors and the rules that find bugs, ADR-0425) in the supervisor, scripts/
  # and .claude/hooks/, mypy with the settings of mypy.ini over supervisor/src
  # (ADR-0447), bash -n and shellcheck with the settings of .shellcheckrc on the
  # shell scripts of deploy/, scripts/ and .claude/hooks/ (ADR-0448), and the JSON
  # syntax of feature-list.json and .claude/settings.json; each part runs even
  # when another one failed (ADR-0190). Then the known vulnerabilities of the supervisor's
  # runtime dependencies. ruff, mypy, shellcheck (the wheel shellcheck-py, which
  # carries the binary) and pip-audit, and every package they depend on, come from
  # .github/lint-requirements.txt with their hashes, so that a new release cannot
  # change the tools. The runner has a shellcheck of its own on PATH: make lint takes
  # the pinned one from setup-python's folder (SHELLCHECK in the step's environment),
  # where pip put it, and prints the version that ran.
  # mypy reads the supervisor's packages and their
  # type stubs, which are not hashed: they go into a venv of their own after the
  # audit, never into the tools' Python, and make lint takes it as PYTHON.
  lint:
    name: Lint and Audit (Python)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.lint != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            supervisor/requirements.txt
            supervisor/requirements-dev.txt
            .github/lint-requirements.txt

      - name: Install ruff, mypy, shellcheck and pip-audit
        id: tools
        run: 'pip install --require-hashes --only-binary=:all: -r .github/lint-requirements.txt'

      # Resolves requirements.txt, with the dependencies of its packages, in a
      # temporary virtual environment of pip, setuptools and wheel pinned with
      # their hashes (.github/audit-env-requirements.txt), then pip-audit checks
      # what it resolved (ADR-0423). The weekly audit workflow (audit.yml) runs
      # it too, for advisories published between pull requests. Each check runs
      # even if the other one failed.
      - name: Audit the runtime dependencies
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: scripts/audit-python.sh

      - name: Install the supervisor's packages for mypy
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: 'python -m venv supervisor/.venv && supervisor/.venv/bin/pip install --only-binary=:all: --no-binary=nut2 -r supervisor/requirements-dev.txt'

      # The pinned shellcheck, from setup-python's folder: the runner has its own on PATH.
      - name: Lint
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          SHELLCHECK: ${{ env.pythonLocation }}/bin/shellcheck
        run: make lint

  # The web UI: make frontend (svelte-check, the checks of the web UI's runes,
  # texts and design system, the production build, ESLint and Prettier's
  # check of webui/src, ADR-0449, each also when another one failed), and the
  # known vulnerabilities of its runtime dependencies. Node.js as in the
  # builder stage of webui/Dockerfile. No E2E spec runs here: they need the
  # stand-in and Playwright's Chromium and WebKit (WebKit for
  # webui/tests/form-fields.spec.ts), which make setup installs and make
  # e2e-local runs on a workstation (docs/TESTING.md).
  frontend:
    name: Frontend Checks
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.webui != 'false' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        id: install
        working-directory: webui
        run: npm ci

      # The scripts of package.json: check (svelte-kit sync, which writes
      # node_modules/$app/tsconfig.json, then svelte-check --threshold error), the
      # checks of runes, texts and design, the build, lint (ESLint, a warning
      # fails too) and format-check (Prettier). npm run takes the programs from
      # node_modules/.bin, where npm ci installed the versions of
      # package-lock.json; npx would download a missing one from the registry
      # instead, without asking where CI is set.
      - name: Type check, lint and build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make frontend

      - name: Audit the runtime dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: webui
        run: npm audit --omit=dev --audit-level=high

  # A change of documents and the ledger alone: make test-fast (the ADRs, the ledger, the guard, the
  # repository's tooling and its secret scan) and the backend tests outside it whose code names a
  # document of the repository, each also when the other failed. The whole history, for the ledger's
  # comparison with origin/main. test_repo_tooling.py fails for a test file that names a document and
  # is missing here.
  docs:
    name: Docs and Ledger
    needs: changes
    if: needs.changes.outputs.docs_only == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            supervisor/requirements.txt
            supervisor/requirements-dev.txt

      - name: Install dependencies
        id: deps
        run: 'pip install --only-binary=:all: --no-binary=nut2 -r supervisor/requirements-dev.txt'

      - name: Run the convention tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          PYTEST_ARGS: -rfEs
        run: make test-fast

      - name: Run the tests that read documents
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        env:
          PYTEST_ARGS: -rfEs
        run: make test TESTS='tests/test_ci_changed_areas.py tests/test_deploy_scripts.py tests/test_emergency.py tests/test_image_scan.py tests/test_prune_merged_branches.py tests/test_secret_scan.py tests/test_ws_stats.py'

  # The messages of the pull request's commits follow the commit convention
  # (ADR-0209): scripts/check-commit-msg.py, the script of the commit-msg hook.
  # It checks the commits from the one that added it on.
  commits:
    name: Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the range from the base to the head of the pull request.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the commit messages
        run: python3 scripts/check-commit-msg.py --range "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Every commit of the history against gitleaks' rules and those of .gitleaks.toml, with its
  # allowlist by commit and path (ADR-0445): make secret-scan runs gitleaks' image, pinned by
  # digest, without the network, and prints a finding as its rule, file and commit, never its
  # value. The whole history: the script refuses a shallow clone.
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan every commit for secrets
        run: make secret-scan

  # The images' build, on main only, when what they build from changed, and not after failed Unit Tests;
  # also when Unit Tests were skipped, since no pull request runs it.
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.images != 'false' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build images
        run: |
          cd deploy
          docker compose build --quiet
