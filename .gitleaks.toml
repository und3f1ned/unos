# The rules of the secret scan of the git history (ADR-0445): scripts/secret-scan.sh runs gitleaks
# with this file over every commit that HEAD reaches. gitleaks' default rules, plus the two shapes
# in which this repository has written secrets down and which they miss (ADR-0212).
#
# The allowlist names commits and paths, never values: each block below lets the findings of one
# commit in the paths it lists pass, with the reason, and only those (condition AND). The
# findings were judged by rule, file and commit; no value was shown. A new finding fails the scan:
# move the secret into dev.env (ADR-0212) and rotate it, or, for a test value or a placeholder,
# choose one that no rule takes for a secret. The history is never rewritten (ADR-0208).
# Inline gitleaks:allow comments do not count (--ignore-gitleaks-allow).

[extend]
useDefault = true

# The device's password on sshpass's command line, as the old CLAUDE.md wrote it.
[[rules]]
id = "sshpass-password"
description = "A password on the command line of sshpass"
regex = '''\bsshpass\b[^\n]*?\s-p\s*('[^'\n]{4,}'|"[^"\n]{4,}"|[^\s'"`]{4,})'''
secretGroup = 1
keywords = ["sshpass"]

[[rules.allowlists]]
description = "A variable or a placeholder, not a value"
regexes = ['''^['"]?[$<{]''']

# A literal assigned to a secret's name, as dev.env holds them: a name whose last part ends in one of
# the guard's secret words (_is_secret_name of .claude/hooks/guard.py, ADR-0211), PASS but in
# BYPASS, ASKPASS and the like.
[[rules]]
id = "secret-assignment"
description = "A literal assigned to the name of a secret"
regex = '''\b[A-Z0-9_]*(?:PASSWORD|PASSWD|PASSPHRASE|TOKEN|SECRET|AUTHKEY|APIKEY|PRIVATEKEY|ACCESSKEY|PASS|(?:API|PRIVATE|ACCESS|AUTH)_KEY)=('[^'\n]{4,}'|"[^"\n]{4,}"|[^\s'"`,;|&)\]}>$<{][^\s'"`,;|&)\]}>]{3,})'''
secretGroup = 1
keywords = ["pass", "token", "secret", "key"]

[[rules.allowlists]]
description = "A variable or a placeholder, not a value"
regexes = ['''^['"]?[$<{]''']

[[rules.allowlists]]
description = "PASS in a word that names no secret"
regexTarget = "match"
regexes = ['''(?:BY|COM|ENCOM|ASK|SUR|OVER|UNDER|TRES|MULTI|SUB)PASS=''']

# --- The allowlist: one commit each, the paths of its findings, and why they are no secret. ---

[[allowlists]]
description = "The dev device's root password and the UNOS administrator's password that CLAUDE.md published: both rotated on 2026-11-07, so they open nothing (ADR-0226), and kept in the history, which is not rewritten (ADR-0208)"
condition = "AND"
commits = ["da193b8b0c12fc431a2675234ede1c2ebf7611e3"]
paths = ['''^CLAUDE\.md$''']

[[allowlists]]
description = "The tests of the guard, of the dev scripts and of the secret scan of the working tree hold the shapes of secrets they refuse, with made-up values (ADR-0211, ADR-0212)"
condition = "AND"
commits = ["2e4306d2565db4b6b500bd5ecc1fa61d67b69d2c"]
paths = [
  '''^supervisor/tests/test_agent_guard\.py$''',
  '''^supervisor/tests/test_dev_scripts\.py$''',
  '''^supervisor/tests/test_repo_tooling\.py$''',
]

