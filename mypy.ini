# mypy's settings for make lint, which checks supervisor/src with them against the supervisor's
# Python environment (--python-executable), and for the CI workflow's Lint job, which runs make
# lint (ADR-0447). An error left in the code carries `# type: ignore[<code>]` with its reason.
[mypy]
# The supervisor runs in its Linux container: the stubs of os, psutil and others as on Linux.
python_version = 3.11
platform = linux
# The package is `src`, below supervisor/ (supervisor/AGENTS.md), without an __init__.py.
mypy_path = supervisor
explicit_package_bases = True
# The bodies of functions without annotations are checked too, with their arguments as Any.
check_untyped_defs = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
enable_error_code = ignore-without-code
