version: '3.8'

services:
  supervisor:
    build: ../supervisor
    container_name: unos-supervisor
    restart: unless-stopped
    privileged: true
    pid: host
    hostname: ${HOSTNAME:-unos}
    environment:
      - UNOS_DB_PATH=/data/unos.db
      - UNOS_JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    volumes:
      - unos-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/samba:/etc/samba
      - /etc/os-release:/host/os-release:ro
      - /etc/hostname:/host/hostname:ro
      - type: bind
        source: /mnt
        target: /mnt
        bind:
          propagation: rshared
    networks:
      - unos-net

  webui:
    build: ../webui
    container_name: unos-webui
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - supervisor
    networks:
      - unos-net

volumes:
  unos-data:
  caddy-data:
  caddy-config:

networks:
  unos-net:
