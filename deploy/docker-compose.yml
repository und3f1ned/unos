services:
  supervisor:
    build:
      context: ../supervisor
      # The version the web interface shows: install.sh and update.sh set it
      # to `git describe --tags --always` of the checkout before they build
      # (ADR-0234). A build without it reports "unknown".
      args:
        UNOS_VERSION: ${UNOS_VERSION:-unknown}
    container_name: unos-supervisor
    # Docker rotates the log at 10 MB and keeps 3 files (ADR-0330): it never fills the system disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    privileged: true
    pid: host
    hostname: ${HOSTNAME:-unos}
    environment:
      - UNOS_DB_PATH=/data/unos.db
      # Empty: the supervisor generates a random secret on first start and
      # keeps it in the unos-data volume (/data/jwt_secret). Known placeholder
      # values are refused at startup.
      - UNOS_JWT_SECRET=${JWT_SECRET:-}
      # Uvicorn takes the client address from X-Forwarded-For only on
      # connections from this address: the webui container (Caddy), see
      # unos-net below. Never "*" or the whole subnet: processes in the host's
      # network namespace (including host-network apps) can connect to port
      # 8080 directly, from the gateway address, and would pick their own
      # address and login rate-limit bucket.
      - FORWARDED_ALLOW_IPS=172.31.254.2
      # SQLite creates its own temporary files (large sorts, temporary
      # tables) in $SQLITE_TMPDIR, else $TMPDIR, else /var/tmp before /tmp:
      # with this, on the tmpfs below, like those of Python's tempfile.
      - TMPDIR=/tmp
      # The supervisor's log level (ADR-0398): DEBUG, INFO, WARNING, ERROR or CRITICAL. Set
      # UNOS_LOG_LEVEL in /etc/unos/secrets.env and recreate the container to change it.
      - UNOS_LOG_LEVEL=${UNOS_LOG_LEVEL:-INFO}
    volumes:
      - unos-data:/data
      # The certificate that the web UI's Caddy serves when an administrator chose a stored one:
      # one file, mode 0600, which only this container writes and only webui mounts besides
      # (ADR-0404).
      - served-certificate:/served-certificate
      # The local names of apps and their Caddy sites, which the supervisor writes and the web UI's
      # Caddy imports read-only (ADR-0420).
      - app-names:/app-names
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/samba:/etc/samba
      - /etc/os-release:/host/os-release:ro
      - type: bind
        source: /mnt
        target: /mnt
        bind:
          propagation: rshared
    # Temporary files in RAM: the container's writable layer is on the system
    # disk, on many boards an SD card, which writes wear out. The largest use
    # is a restore (supervisor/src/backup/router.py), which reads the archive
    # in one pass and extracts only the database here, at most MAX_DB_BYTES
    # (48 MiB), while a backup made meanwhile collects its files here: a copy
    # of the database and the small files, at most MAX_TAR_BYTES (64 MiB), or
    # it could not be restored (deploy/update.sh copies the database here the
    # same way). That is 112 MiB, and 80 MiB more are for restic's pack files while an
    # off-device copy runs (its cache for an S3 store is not bounded: a copy
    # that fills the tmpfs fails). A fixed size, not a
    # percentage of the RAM, so that the backup limits can be held against it
    # (ADR-0406): at most a fifth of the 1 GB of RAM that UNOS needs at least.
    # Uploads write nothing here: an uploaded backup is checked in one pass,
    # as a stream. A tmpfs takes RAM only for the files it holds: about the
    # size of the database while a backup is restored or made, nothing in
    # between. Beyond the limit, writes fail with "No space left on device":
    # a backup fails, and a restore answers 507, before either has changed
    # anything; a database over MAX_DB_BYTES is refused before the copy, with
    # the limit in the message. noexec, nosuid and nodev are Docker's
    # defaults, stated here: nothing runs from /tmp. A restart empties it.
    # supervisor/tests/test_deploy_scripts.py checks the limit against those
    # constants.
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=192m
      # btrfs scrub rewrites its progress file in /var/lib/btrfs every 5
      # seconds while a scrub runs (hours on a large pool), each time a new
      # file renamed over the old one, which ext4 writes out at once: in RAM,
      # not in the writable layer on the system disk. The result of the last
      # scrub is forgotten when the supervisor restarts.
      - /var/lib/btrfs:noexec,nosuid,nodev,size=1m,mode=755
    networks:
      unos-net:
        ipv4_address: 172.31.254.3
    # Healthy once the API answers; docker ps shows it, and compose starts
    # webui only then (depends_on below; at boot Caddy waits for the API
    # itself, webui's command). Python, because the image has neither curl nor
    # wget, and without a proxy, so that HTTP_PROXY in the container's
    # environment cannot divert the request. While the container starts
    # (start_period), Docker runs the check every 5 seconds (its default
    # start_interval since Engine 25). Before the API answers, the supervisor
    # mounts the pools the host has not mounted (up to 2 minutes each): failed
    # checks only count after start_period, a successful one counts at once.
    # `docker compose up` starts webui once the supervisor is healthy. With
    # Docker Engine 29 it fails at once when the supervisor exits. For one
    # that runs without answering, Docker decides within start_period +
    # (retries + 1) x (interval + timeout) = 600 + 4 x (10 + 10) = 680
    # seconds: a failed check counts only if it started after start_period,
    # so the one that runs then does not, and the supervisor is unhealthy
    # after retries more; a check takes up to timeout once its process has
    # started, and Docker waits interval after each one. update.sh, install.sh
    # and its systemd unit pass at least that as --wait-timeout
    # (SUPERVISOR_START_TIMEOUT), which Compose 2.30 or later applies to this
    # wait, so that Compose does not give up on the supervisor first. Change
    # SUPERVISOR_START_TIMEOUT in both scripts, and UNOS_DEV_UP_TIMEOUT of
    # scripts/dev/deploy.sh, with these values.
    # bash asks for the health without a proxy: a Python that did only that cost a SpacemiT K1
    # 0.5 s of CPU every interval, bash 0.01 s (ADR-0375). Compose reads $$ as $.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'u=http://127.0.0.1:8080/api/v1/health && a=$${u#*//} && p=/$${a#*/} && a=$${a%%/*} && exec 3<>"/dev/tcp/$${a%:*}/$${a##*:}" && printf "GET %s HTTP/1.0\r\nHost: %s\r\n\r\n" "$$p" "$$a" >&3 && read -r -t 5 _ code _ <&3 && [ "$$code" = 200 ] || exit 1'
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10m

  webui:
    build: ../webui
    container_name: unos-webui
    logging:  # as the supervisor's (ADR-0330)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Name on the HTTPS certificate from Caddy's local CA. Clients that
      # connect by IP address get this certificate too (see webui/Caddyfile).
      - UNOS_HOSTNAME=${UNOS_HOSTNAME:-unos}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # The served certificate that the supervisor writes (ADR-0404), read-only here.
      - served-certificate:/served-certificate:ro
      # The app names' Caddy sites that the supervisor writes (ADR-0420), read-only here.
      - app-names:/app-names:ro
    # Not before the API answers: until then every request would fail with 502.
    depends_on:
      supervisor:
        condition: service_healthy
    # Caddy only once the API answers, whoever starts the container: depends_on
    # orders docker compose up, but at boot dockerd starts the containers it
    # still has itself, by their restart policy and at once (after a power
    # cut, or on a host without the unos unit of install.sh, such as the dev
    # device; ADR-0307). busybox sh and wget (caddy:2-alpine) request the
    # health route at Caddy's upstream (webui/Caddyfile) without a proxy, like
    # the supervisor's own check, and pause 2 seconds after a failed try. A
    # try writes no file (-O /dev/null), and an error is printed only when it
    # differs from the one before: no log line per try (ADR-0214), and a cause
    # that stays shows in docker logs. $$ is the shell's $ (compose would fill
    # in a single $ from the host's environment). Then the TLS of webui/Caddyfile
    # (ADR-0404): the served certificate when the supervisor wrote one and Caddy
    # validates it, else Caddy's local CA, with one line that says why, so that a
    # certificate that does not load never leaves the web UI without HTTPS; the app
    # names (ADR-0420) only when Caddy validates them too, else none, with one line;
    # and the CMD of webui/Dockerfile: change both together.
    command:
      - /bin/sh
      - -c
      - >-
        until err=$$(wget -q -Y off -T 5 -O /dev/null http://supervisor:8080/api/v1/health 2>&1);
        do [ "$$err" = "$$last" ] || echo "unos-webui: waiting for the supervisor's API: $$err";
        last=$$err; sleep 2; done;
        UNOS_TLS=local;
        if [ -e /served-certificate/served.pem ]; then
        if err=$$(UNOS_TLS=served UNOS_APP_NAMES=off caddy validate --config /etc/caddy/Caddyfile 2>&1); then UNOS_TLS=served;
        else echo "unos-webui: the served certificate does not load, Caddy's local CA instead: $$(echo "$$err" | tail -n 1)";
        fi; fi;
        export UNOS_TLS;
        UNOS_APP_NAMES=off;
        if [ -e /app-names/on/sites.caddy ]; then
        if err=$$(UNOS_APP_NAMES=on caddy validate --config /etc/caddy/Caddyfile 2>&1); then UNOS_APP_NAMES=on;
        else echo "unos-webui: the app names do not load, the web UI starts without them: $$(echo "$$err" | tail -n 1)";
        fi; fi;
        export UNOS_APP_NAMES;
        exec caddy run --config /etc/caddy/Caddyfile
    networks:
      unos-net:
        # The supervisor trusts X-Forwarded-For from this address only.
        ipv4_address: 172.31.254.2
    # Caddy, and the API behind it, over plain HTTP: the http:// site of
    # webui/Caddyfile serves /api/v1/health without the redirect to HTTPS.
    # busybox wget (caddy:2-alpine).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  unos-data:
  caddy-data:
  caddy-config:
  served-certificate:
  app-names:

networks:
  unos-net:
    ipam:
      config:
        # Fixed so that webui keeps the address the supervisor trusts. Both
        # containers have fixed addresses, so no automatic address assignment
        # can take webui's. Host processes connect from the gateway (.1). If
        # this subnet is already used on the host, change every 172.31.254.x
        # address in this file together.
        - subnet: 172.31.254.0/24
          gateway: 172.31.254.1
